<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typotheque</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/favicon.ico" type="image/x-icon">
</head>


<body>


<header class="bovenbalk">

<div class="typotheque-logo">
    <p class="typotheque-text">TYPOTHEQUE</p>
</div>


<div class="menu-button">
    <img class="menu-button-img" src="images/menubutton.svg" alt="Menu Button">
</div>

<div class="login-button">
    <p class="login-button-txt">Log in</p>
</div>


<div class="search-button">
    <img class="search-button-img" src="images/search.png" alt="Search Button">
</div>



</header>


<main> 

<div class="chairman">


</div>


<div class="parent">

    <div class="div1">
        <p class="all-fonts">All Fonts</p>
        <img class="allimage" src="images/allfonts.png" alt="All Fonts">
    </div>
    <div class="div2">
        <p class="global-fonts" >Global Fonts</p>
        <img class="globalimage" src="images/globalfonts.png" alt="Global Fonts">
    </div>
    <div class="div3"> 
        <p class="variable-fonts">Variable Fonts</p>
        <img class="variableimage" src="images/variablefonts.png" alt="Variable Fonts">
    </div>
    <div class="div4"> 
        <p class="smart-fonts">Smart Fonts</p>
        <img class="smartimage" src="images/smartfonts.png" alt="Smart Fonts">
    </div>
    <div class="div5">
        <p class="superfamilies">Superfamilies</p>
        <img class="superimage" src="images/superfamilies.png" alt="superfamilies">
    </div>
    <div class="div6">
        <p class="legibility-fonts">Legibility Fonts</p>
        <img class="legibilityimage" src="images/legibilityfonts.png" alt="legibility Fonts">
    </div>
    <div class="div7"> 
        <p class="optical-sizes">Optical Sizes</p>
        <img class="opticalimage" src="images/opticalsizes.png" alt="Optical Sizes">
    </div>
</div>


</main>





</body>









</html>
